<footer class="border-t border-border py-6">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 flex flex-wrap items-center justify-between gap-x-6 gap-y-2 text-xs text-muted-foreground">
    <span>© {{ site.time | date: "%Y" }} DataTalks.Club</span>
    <span class="flex flex-wrap gap-x-5 gap-y-1">
      {% for link in site.data.footer.links %}
      <a href="{{ link.href }}" target="_blank" rel="noopener noreferrer" class="hover:text-brand-blue transition-colors">{{ link.label }}</a>
      {% endfor %}
    </span>
  </div>
</footer>
